name: 使用问题
description: 报告可复现的问题；请用虚构示例代替私人笔记。
body:
  - type: input
    id: versions
    attributes:
      label: 系统、Obsidian 与插件版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何复现
      description: 从哪个入口开始、做了什么、实际结果与期望结果。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 可选示例
      description: 请仅附原创或虚构的最小示例；不要上传整库、凭据或真实书签配置。
